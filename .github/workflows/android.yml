name: Build Noticall APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa Android 16
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installa Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compila Noticall
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepara APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Noticall-test.apk

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: Noticall-test-apk
          path: Noticall-test.apkv
